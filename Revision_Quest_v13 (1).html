<!doctype html><html lang="en"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name=theme-color content="#F5F5F5"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><link rel=preconnect href="https://fonts.googleapis.com"><link rel=preconnect href="https://fonts.gstatic.com" crossorigin><link rel=stylesheet href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap"></head><body>
<title>Revision Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--surf:#fff;--soft:#EEE8E0;--bd:rgba(60,40,20,.06);--bd2:rgba(60,40,20,.08);--hov:rgba(60,40,20,.05);--gsh:rgba(60,40,20,.08);--bg:#F5F5F5;--card:#FFFBF6;--text:#262626;--muted:#7A7A7A;--line:#EDE6DD;--track:#E9E4DD;--a:#F4503A;--a2:#C73A27;--a3:#B3301E;--ok:#2BA55B;--bad:#E5484D;--amb:#F59E0B;--vio:#6D5BF0;--blu:#1A7FE0;--sh:0 6px 18px rgba(60,40,20,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:500 15px/1.4 'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
body.nta-on{background:#fff;--bg:#fff;--card:#fff;--text:#262626;--muted:#7A7A7A;--line:#EDE6DD;--track:#E9E4DD;--surf:#fff;--soft:#EEE8E0;--bd:rgba(60,40,20,.06);--bd2:rgba(60,40,20,.08);--hov:rgba(60,40,20,.05);--gsh:rgba(60,40,20,.08);color-scheme:light}html:has(body.nta-on){background:#fff}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
[hidden]{display:none!important}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px calc(env(safe-area-inset-bottom,0px) + 118px);display:flex;flex-direction:column;gap:14px}
#app.enter>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{20%{transform:translateX(-6px)}60%{transform:translateX(6px)}}

h1{margin:0;font-size:30px;font-weight:800;letter-spacing:-.6px;line-height:1.15}
h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
.grow{flex:1;min-width:0}.strong{font-weight:700}.muted{color:var(--muted)}.hint{font-size:13px;color:var(--muted);font-weight:500}.center{text-align:center}
.line{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:12px}.stack.s{gap:8px}
.label{font-size:12px;letter-spacing:.8px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:4px 2px -4px}
.top{display:flex;align-items:center;gap:12px}
.card{background:var(--card);border:1.5px solid var(--bd);border-bottom-width:3px;border-radius:26px;box-shadow:var(--sh);padding:16px;display:flex;flex-direction:column;gap:10px}
.card.flat{padding:0;gap:0;overflow:hidden}
.card.tap{width:100%;transition:transform .12s}.card.tap:active{transform:scale(.98)}
.rbtn{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--card);border:1.5px solid var(--bd);border-bottom-width:3px;box-shadow:0 4px 12px rgba(60,40,20,.08)}
.rbtn:active{transform:scale(.94)}
.btn{min-height:56px;padding:0 20px;border-radius:26px;background:var(--a);color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 var(--a2);transition:transform .08s,box-shadow .08s;width:100%}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--a2)}
.btn.ghost{background:var(--card);color:var(--text);border:1.5px solid var(--bd2);box-shadow:0 4px 0 var(--gsh);font-weight:600}
.btn.dark{background:#262626;box-shadow:0 5px 0 #000}
.btn.white{background:#fff;color:var(--a3);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btn.sm{min-height:44px;font-size:15px;padding:0 16px;border-radius:22px;width:auto}
.btn[disabled]{background:#E3E0DA;color:#9a9a9a;box-shadow:0 4px 0 #D3CFC8}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--bd2);background:var(--card);font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.sm{min-height:32px;padding:0 12px;font-size:13px}
.seg{display:flex;gap:6px;padding:4px;border-radius:999px;background:var(--card);border:1.5px solid var(--line)}
.seg button{flex:1;min-height:42px;border-radius:999px;font-weight:600;text-align:center;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--bg)}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--a) 12%,transparent);color:var(--a3);white-space:nowrap}
.badge.soft{background:var(--soft);color:var(--muted)}.badge.ok{background:rgba(43,165,91,.14);color:#1B7A40}.badge.bad{background:rgba(229,72,77,.14);color:#B3262B}
.ico{width:46px;height:46px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.ic{display:inline-flex;vertical-align:middle}
.bar{height:12px;border-radius:99px;background:var(--track);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--ok);animation:fill .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes fill{from{width:0}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats.two{grid-template-columns:1fr 1fr}
.stat{background:var(--card);border:1.5px solid var(--bd);border-bottom-width:3px;border-radius:20px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.1}.stat span{font-size:12px;color:var(--muted);font-weight:600}
.rows .row{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;min-height:60px;border-top:1.5px solid var(--bd)}.rows .row:first-child{border-top:0}
.rows .row:active{background:var(--hov)}
.hero{background:linear-gradient(135deg,var(--a) 0%,var(--a2) 130%);color:#fff;border-radius:32px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 7px 0 var(--a2)}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;opacity:.9}.hero .t{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.5px}.hero .s{opacity:.94;font-weight:500}
.hs{display:flex;gap:14px;overflow-x:auto;margin:0 -18px;padding:4px 18px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}.hs::-webkit-scrollbar{display:none}
.tall{flex:none;width:150px;scroll-snap-align:start;text-align:left;transition:transform .12s}.tall:active{transform:scale(.96)}
.tall .cv{height:128px;border-radius:20px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-weight:800;font-size:34px;box-shadow:0 8px 16px rgba(60,40,20,.14);margin-bottom:8px;position:relative;overflow:hidden}
.tall .cv .ic{position:absolute;right:-8px;top:-8px;opacity:.28}
.tall .t{font-weight:800;font-size:16px;line-height:1.2}.tall .s{color:var(--muted);font-size:13px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-top:8px}.sec-h button{color:var(--muted);font-weight:700;font-size:14px}
.ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;background:var(--surf);color:#fff}.ck.on{background:var(--a);border-color:var(--a)}
.step{display:flex;align-items:center;gap:10px}.step b{font-size:22px;min-width:44px;text-align:center}
/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px);z-index:30;pointer-events:none}
#tabs .pn{max-width:452px;margin:auto;display:flex;background:var(--card);border-radius:999px;padding:6px;gap:2px;box-shadow:0 10px 28px rgba(60,40,20,.16),0 0 0 1px rgba(60,40,20,.05);pointer-events:auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px;justify-content:center;border-radius:999px;font-size:12px;font-weight:600;color:#6F6F6F;text-align:center}
.tab.on{background:var(--hov);color:var(--text);font-weight:800}
/* sheet, toast */
.backdrop{position:fixed;inset:0;background:rgba(20,15,10,.5);z-index:50}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:auto;max-height:86vh;overflow-y:auto;z-index:51;background:var(--card);border-radius:30px 30px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 20px);display:flex;flex-direction:column;gap:12px;animation:rise .25s both}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,12px);max-width:86%;padding:12px 16px;border-radius:16px;background:#262626;color:#fff;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:80;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:var(--surf);border:1.5px solid var(--line);font-size:13px;color:var(--muted)}
.ins{display:flex;gap:10px;align-items:flex-start;font-size:14px}.ins .dot{width:28px;height:28px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
/* runner */
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:22px;padding:8px 16px;border-radius:999px;background:var(--card);border:1.5px solid var(--line);display:flex;align-items:center;gap:6px}
.timer.low{background:var(--bad);color:#fff;border-color:var(--bad);animation:pop 1s infinite}
.qt{font-size:19px;line-height:1.5;font-weight:600;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;padding:14px;border-radius:22px;border:1.5px solid var(--bd2);border-bottom-width:4px;background:var(--card);font-weight:600;font-size:16px;transition:transform .08s}
.opt:active{transform:scale(.99)}
.opt .l{flex:none;width:30px;height:30px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.opt.sel{border-color:var(--a);background:color-mix(in srgb,var(--a) 8%,transparent)}.opt.sel .l{background:var(--a);color:#fff}
.opt.ok{border-color:var(--ok);background:rgba(43,165,91,.1)}.opt.ok .l{background:var(--ok);color:#fff}.opt.bad{border-color:var(--bad);background:rgba(229,72,77,.08)}.opt.bad .l{background:var(--bad);color:#fff}
.numd{min-height:60px;border-radius:20px;border:2px solid var(--line);background:var(--surf);display:flex;align-items:center;padding:0 18px;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;overflow:hidden}
.numd.empty{color:#bbb;font-size:18px;font-weight:500}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kp button{min-height:52px;border-radius:16px;background:var(--card);border:1.5px solid var(--bd2);border-bottom-width:3px;font-weight:700;font-size:20px;text-align:center;display:flex;align-items:center;justify-content:center}
.kp button:active{background:var(--soft)}.kp .w2{grid-column:span 2;font-size:15px}
.foot{position:fixed;left:0;right:0;bottom:0;padding:24px 14px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(rgba(245,245,245,0),var(--bg) 38%);z-index:20}
.foot>div{max-width:480px;margin:auto;display:flex;gap:8px;flex-wrap:wrap}
.foot .btn{min-height:52px;font-size:16px}.foot .rbtn{width:52px;height:52px}
.rbtn.mk.on{background:var(--vio);color:#fff;border-color:var(--vio)}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pb{aspect-ratio:1;border-radius:14px;border:2px solid var(--line);background:var(--surf);font-weight:800;position:relative;text-align:center;display:flex;align-items:center;justify-content:center;font-size:15px}
.pb.a{background:var(--ok);border-color:var(--ok);color:#fff}.pb.s{background:var(--bad);border-color:var(--bad);color:#fff}.pb.m{background:var(--vio);border-color:var(--vio);color:#fff;border-radius:50%}
.pb.ma{background:var(--vio);border-color:var(--vio);color:#fff;border-radius:50%}.pb.ma:after{content:"";position:absolute;right:-2px;bottom:-2px;width:14px;height:14px;border-radius:50%;background:var(--ok);border:2px solid #fff}
.pb.cur{outline:3px solid var(--text);outline-offset:2px}
.leg{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;font-weight:600;color:var(--muted)}.leg span{display:inline-flex;align-items:center;gap:6px}.leg .pb{width:22px;height:22px;aspect-ratio:auto;font-size:0;border-width:0;border-radius:7px}.leg .pb.m,.leg .pb.ma{border-radius:50%}
/* NTA style */
.nta{background:#fff;gap:10px}
.nta .nhead{margin:calc(-1*(env(safe-area-inset-top,0px) + 18px)) -18px 0;padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;background:#0B4F8A;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px}
.nta .nhead .small{font-size:11px;opacity:.8}.nta .nhead .tm{font-weight:700;font-size:15px;background:#fff;color:#0B4F8A;padding:6px 12px;border-radius:4px;font-variant-numeric:tabular-nums}.nta .nhead .tm.low{background:#D32F2F;color:#fff}
.nta .card{border-radius:6px;box-shadow:none;border:1px solid #cfd8e3;background:#fff}
.nta .qbar{background:#E8F0F8;border:1px solid #cfd8e3;padding:8px 12px;font-size:13px;font-weight:600;color:#0B4F8A;display:flex;justify-content:space-between;gap:8px}
.nta .opt{border-radius:6px;border:1px solid #cfd8e3;border-bottom-width:1px;background:#fff}.nta .opt .l{border-radius:50%;background:#fff;border:2px solid #9aa9ba}.nta .opt.sel{background:#E8F0F8;border-color:#0B4F8A}.nta .opt.sel .l{background:#0B4F8A;border-color:#0B4F8A;color:#fff}
.nta .btn{border-radius:4px;box-shadow:none;min-height:46px;font-size:14px;background:#1A7FE0;flex:1}.nta .btn.vio{background:#6D5BF0}.nta .btn.ghost{background:#fff;border:1px solid #9aa9ba;color:#262626}
.nta .nhead .rbtn{background:#fff;color:#0B4F8A;border:0}.nta .foot{background:#fff;border-top:1px solid #cfd8e3;padding-top:10px}
.nta .chip{border-radius:4px;border-color:#cfd8e3;background:#fff}.nta .chip.on{background:#0B4F8A;border-color:#0B4F8A}
.nta .numd,.nta .kp button{border-radius:4px}
.nta .pb{border-radius:4px}.nta .pb.m,.nta .pb.ma{border-radius:50%}
.nta .bar i{background:#0B4F8A}
.chart text{font-family:inherit}
.tag-r{display:flex;gap:6px;flex-wrap:wrap}

.inp{width:100%;min-height:48px;border-radius:16px;border:1.5px solid var(--line);background:var(--surf);padding:0 14px;font-size:16px;font-weight:500}
.inp:focus-visible,button:focus-visible{outline:3px solid var(--vio);outline-offset:2px}
.ta{padding:12px 14px;line-height:1.45;resize:vertical;min-height:96px}

/* ===== v10: theme, polish, motion, settings ===== */
html[data-theme=dark]{--bg:#14110F;--card:#1F1B18;--text:#F4EFE9;--muted:#A69D93;--line:#352F2A;--track:#352F2A;--surf:#2A2521;--soft:#38322D;--bd:rgba(255,255,255,.07);--bd2:rgba(255,255,255,.1);--hov:rgba(255,255,255,.06);--gsh:rgba(0,0,0,.4);--sh:0 8px 22px rgba(0,0,0,.4)}
html[data-theme=dark] .btn[disabled]{background:#2E2925;color:#756c63;box-shadow:0 4px 0 #26211E}
html[data-theme=dark] .tab{color:#9d958c}
html[data-theme=dark] #toast{background:#F4EFE9;color:#1a1612}
html[data-theme=dark] .backdrop{background:rgba(0,0,0,.62)}
html[data-theme=dark] .badge.ok{color:#5BD08A}html[data-theme=dark] .badge.bad{color:#FF8A8E}
html[data-theme=dark] .btn.dark{background:#38322D;box-shadow:0 5px 0 #0c0a09}
html,body{background:var(--bg)}
body{background:transparent;transition:color .3s}
html{transition:background-color .35s}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 55% at 105% -8%,color-mix(in srgb,var(--a) 13%,transparent),transparent 62%),radial-gradient(90% 45% at -12% 2%,color-mix(in srgb,var(--vio) 8%,transparent),transparent 60%)}
body.nta-on{background:#fff}body.nta-on::before{display:none}
.card,.stat,.rbtn,.sheet,#tabs .pn,.inp,.chip,.seg{transition:background-color .3s,border-color .3s}
#app.enter>*:nth-child(2){animation-delay:.05s}#app.enter>*:nth-child(3){animation-delay:.1s}#app.enter>*:nth-child(4){animation-delay:.15s}#app.enter>*:nth-child(5){animation-delay:.2s}#app.enter>*:nth-child(6){animation-delay:.25s}#app.enter>*:nth-child(7){animation-delay:.3s}#app.enter>*:nth-child(n+8){animation-delay:.34s}
.hero{position:relative;overflow:hidden;isolation:isolate}
.hero>*{position:relative;z-index:1}
.hero::before,.hero::after{content:"";position:absolute;z-index:0;border-radius:50%;pointer-events:none}
.hero::before{right:-70px;top:-80px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 68%);animation:float 8s ease-in-out infinite}
.hero::after{left:-50px;bottom:-90px;width:190px;height:190px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);animation:float 10s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(-16px,10px) scale(1.08)}}
.bar i{position:relative;overflow:hidden}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:shine 1.3s 1s ease-out 1 both}
@keyframes shine{to{transform:translateX(100%)}}
.card.tap:active,.tall:active{transform:scale(.97)}
.btn,.chip,.tab,.opt,.rows .row,.card.tap{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.38);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
.btn.ghost .rip,.chip .rip,.tab .rip,.opt .rip,.rows .row .rip,.card.tap .rip{background:var(--hov);filter:brightness(1.4)}
@keyframes rip{to{transform:scale(1);opacity:0}}
/* tab bar */
#tabs .pn{backdrop-filter:blur(16px) saturate(1.5);-webkit-backdrop-filter:blur(16px) saturate(1.5);background:color-mix(in srgb,var(--card) 90%,transparent);position:relative}
.ind{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:999px;background:color-mix(in srgb,var(--a) 14%,transparent);transition:transform .42s cubic-bezier(.3,1.35,.45,1),width .3s;pointer-events:none}
.tab{z-index:1;transition:color .25s;min-width:0}
.tab.on{background:none;color:var(--text)}
.tab .ic{transition:transform .4s cubic-bezier(.3,1.7,.5,1),color .25s}
.tab.on .ic{transform:translateY(-2px) scale(1.14);color:var(--a)}
.tab:active .ic{transform:scale(.86)}
/* sheet / toast */
.backdrop{animation:fade .22s both;backdrop-filter:blur(2px)}
.sheet{animation:sheetup .38s cubic-bezier(.2,.9,.25,1) both;box-shadow:0 -12px 40px rgba(0,0,0,.2)}
.sheet::before{content:"";flex:none;width:40px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 0}
.backdrop.out{animation:fadeout .2s both}.sheet.out{animation:sheetdn .2s ease-in both}
@keyframes fade{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes sheetup{from{transform:translateY(100%)}}@keyframes sheetdn{to{transform:translateY(100%)}}
#toast{transition:opacity .2s,transform .4s cubic-bezier(.3,1.6,.5,1);box-shadow:0 10px 26px rgba(0,0,0,.25)}
/* test runner */
.opt{transition:transform .12s,background-color .2s,border-color .2s}
.opt.pulse{animation:selpop .38s cubic-bezier(.3,1.6,.5,1)}
.opt .l{transition:background-color .2s,color .2s,transform .3s cubic-bezier(.3,1.7,.5,1)}.opt.sel .l{transform:scale(1.08)}
