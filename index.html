.opt.ok{border-color:var(--ok);background:rgba(43,165,91,.1)}.opt.ok .l{background:var(--ok);color:#fff}.opt.bad{border-color:var(--bad);background:rgba(229,72,77,.08)}.opt.bad .l{background:var(--bad);color:#fff}

html,body{background:var(--bg)}

html{transition:background-color .35s}

lse], [1, "Dimensions of Force, weight", "[M L T⁻²]", true], [1, "Dimensions of Work, energy, torque", "[M L² T⁻²]", true], [1, "Dimensions of Power", "[M L² T⁻³]", true], [1, "Dimensions of Momentum, impulse", "[M L T⁻¹]", true], [1, "Dimensions of Pressure, stress, modulus", "[M L⁻¹ T⁻²]", true], [1, "Dimensions of Density", "[M L⁻³]", false], [1, "Dimensions of Angular momentum, Planck h", "[M L² T⁻¹]", true], [1, "Dimensions of Surface tension, spring constant", "[M T⁻²]", false], [1, "Dimensions of Coefficient of viscosity η", "[M L⁻¹ T⁻¹]", false], [1, "Dimensions of Gravitational constant G", "[M⁻¹ L³ T⁻²]", true], [1, "Dimensions of Specific heat", "[L² T⁻² K⁻¹]", false], [1, "Dimensions of Latent heat", "[L² T⁻²]", false], [1, "Dimensions of Boltzmann constant k", "[M L² T⁻² K⁻¹]", false], [1, "Dimensions of Universal gas constant R", "[M L² T⁻² K⁻¹ mol⁻¹]", false], [1, "Dimensions of Thermal conductivity", "[M L T⁻³ K⁻¹]", false], [1, "Dimensions of Stefan’s constant σ", "[M T⁻³ K⁻⁴]", false], [1, "Dimensions of Electric charge", "[A T]", false], [1, "Dimensions of Electric field E", "[M L T⁻³ A⁻¹]", false], [1, "Dimensions of Potential difference V", "[M L² T⁻³ A⁻¹]", false], [1, "Dimensions of Resistance R", "[M L² T⁻³ A⁻²]", false], [1, "Dimensions of Capacitance C", "[M⁻¹ L⁻² T⁴ A²]", false], [1, "Dimensions of Inductance L", "[M L² T⁻² A⁻²]", false], [1, "Dimensions of Magnetic field B", "[M T⁻² A⁻¹]", false], [1, "Dimensions of Magnetic flux", "[M L² T⁻² A⁻¹]", false], [1, "Dimensions of Permittivity ε₀", "[M⁻¹ L⁻³ T⁴ A²]", false], [1, "Dimensions of Permeability μ₀", "[M L T⁻² A⁻²]", false]], "sum": "Every measurement is a number × unit, and SI has seven base quantities; everything else is derived. Dimensions are the powers of M, L and T. Use them to check a formula, convert units or derive a relation, but never to prove a formula or to get constants like ½ or 2π. Only like quantities add, and the argument of sin, log or eˣ is dimensionless. In addition and subtraction keep the fewest decimal places; in multiplication and division keep the fewest significant figures. Absolute errors add for sums and differences, relative errors add for products and quotients, and a power multiplies the relative error. Vernier and screw gauge both read main scale + extra scale × least count, and the zero error is corrected first.", "A": [[0, "one", "", "Every measurement is a **number × unit**. SI has **7 base quantities**. Everything else is derived from them.", false], [0, "nt", "Measurement", "**Physical quantity = numerical value × unit.** A bigger unit gives a smaller number: 72 km/h = 20 m/s.", false], [0, "tbl", "The 7 SI base quantities", "[[\"Quantity\", \"SI unit\", \"Symbol\"], [[\"Length\", \"metre\", \"m\"], [\"Mass\", \"kilogram\", \"kg\"], [\"Time\", \"second\", \"s\"], [\"Electric current\", \"ampere\", \"A\"], [\"Temperature\", \"kelvin\", \"K\"], [\"Amount of substance\", \"mole\", \"mol\"], [\"Luminous intensity\", \"candela\", \"cd\"]]]", false], [0, "mn", "", "**Order trick:** **L**ong **M**ice **T**ry **C**heese **T**hen **A**im **L**ow gives Length, Mass, Time, Current, Temperature, Amount, Luminous.", false], [0, "nt", "Derived and supplementary", "**Derived quantities** come from base ones: force, work, pressure, charge, velocity, density.\n- **Angle and solid angle** have units (rad, sr) but **no dimensions**.", false], [0, "tbl", "Systems of units", "[[\"System\", \"Length\", \"Mass\", \"Time\"], [[\"CGS\", \"cm\", \"g\", \"s\"], [\"MKS\", \"m\", \"kg\", \"s\"], [\"FPS\", \"foot\", \"pound\", \"s\"], [\"SI\", \"m\", \"kg\", \"s (+ A, K, mol, cd)\"]]]", false], [0, "tbl", "SI since 2019: each unit is fixed by a constant", "[[\"Unit\", \"Fixed by\"], [[\"second\", \"Caesium-133 frequency, 9 192 631 770 Hz\"], [\"metre\", \"c = 299 792 458 m/s\"], [\"kilogram\", \"h = 6.62607015 × 10⁻³⁴ J s\"], [\"ampere\", \"e = 1.602176634 × 10⁻¹⁹ C\"], [\"kelvin\", \"k = 1.380649 × 10⁻²³ J/K\"], [\"mole\", \"N_A = 6.02214076 × 10²³ mol⁻¹\"], [\"candela\", \"K_cd = 683 lm/W\"]]]", false], [0, "tbl", "SI prefixes", "[[\"Prefix\", \"Symbol\", \"Power\"], [[\"tera\", \"T\", \"10¹²\"], [\"giga\", \"G\", \"10⁹\"], [\"mega\", \"M\", \"10⁶\"], [\"kilo\", \"k\", \"10³\"], [\"centi\", \"c\", \"10⁻²\"], [\"milli\", \"m\", \"10⁻³\"], [\"micro\", \"μ\", \"10⁻⁶\"], [\"nano\", \"n\", \"10⁻⁹\"], [\"pico\", \"p\", \"10⁻¹²\"], [\"femto\", \"f\", \"10⁻¹⁵\"]]]", false], [0, "tbl", "Practical units of length", "[[\"Unit\", \"Value\", \"Used for\"], [[\"fermi\", \"10⁻¹⁵ m\", \"nuclei\"], [\"angstrom (Å)\", \"10⁻¹⁰ m\", \"atoms\"], [\"astronomical unit\", \"1.496 × 10¹¹ m\", \"solar system\"], [\"light year\", \"9.46 × 10¹⁵ m\", \"stars\"], [\"parsec\", \"3.08 × 10¹⁶ m (3.26 ly)\", \"stars\"]]]", false], [0, "tbl", "Other units to know", "[[\"Unit\", \"Equals\"], [[\"1 amu\", \"1.66 × 10⁻²⁷ kg\"], [\"1 eV\", \"1.6 × 10⁻¹⁹ J\"], [\"1 atm\", \"1.013 × 10⁵ Pa\"], [\"1 bar\", \"10⁵ Pa\"], [\"1 torr\", \"133.3 Pa\"], [\"1 cal\", \"4.18 J\"], [\"1 hp\", \"746 W\"], [\"1 dyne\", \"10⁻⁵ N\"], [\"1 erg\", \"10⁻⁷ J\"], [\"1 gauss\", \"10⁻⁴ T\"]]]", false], [0, "t", "", "To convert fast, write the unit relation as a fraction equal to 1 and multiply. For example 72 km/h × (1000 m / 1 km) × (1 h / 3600 s) = 20 m/s. Shortcut: km/h to m/s multiply by 5/18.", true], [0, "m", "", "Mass has the base unit kilogram, not gram. A prefix is applied to the gram: 1 mg = 10⁻⁶ kg, not 10⁻³ kg.", true], [0, "m", "", "Do not confuse milli (10⁻³) with micro (10⁻⁶) or mega (10⁶) with giga (10⁹). Most unit slips come from here.", true], [0, "x", "Convert 1 N into dyne.", "1 N = 1 kg m s⁻² = (1000 g)(100 cm) s⁻² = 10⁵ g cm s⁻² = 10⁵ dyne.", false], [0, "x", "Light takes 8 min 20 s to come from the Sun. Estimate the Earth–Sun distance.", "t = 500 s, c = 3 × 10⁸ m/s. d = ct = 3 × 10⁸ × 500 = 1.5 × 10¹¹ m, which is 1 AU.", false], [1, "one", "", "Dimensions are the **powers of M, L and T** in a quantity. Use them to **check, convert and derive**. They never prove a formula.", false], [1, "nt", "What are dimensions?", "Velocity = length ÷ time, so its dimensional formula is **[L T⁻¹]**. In general a quantity is **[Mᵃ Lᵇ Tᶜ]**.", false], [1, "nt", "Principle of homogeneity", "**Every term in a correct equation has the same dimensions.**\n- Only like quantities can be added, subtracted or equated.\n- The argument of **sin, cos, log and eˣ** must be dimensionless.", false], [1, "tbl", "What dimensional analysis can and cannot do", "[[\"Can\", \"Cannot\"], [[\"Check a formula\", \"Give constants like ½ or 2π\"], [\"Convert units\", \"Handle sin x, log x or eˣ of a variable\"], [\"Derive a relation (up to 3 quantities)\", \"Prove a formula is physically correct\"]]]", false], [1, "nt", "Converting between systems", "**n₂ = n₁ [M₁/M₂]ᵃ [L₁/L₂]ᵇ [T₁/T₂]ᶜ**\nOld unit on top, new unit below.", false], [1, "nt", "Derive a relation in 3 steps", "- **Assume** quantity = k · aᵖ bᵠ cʳ.\n- **Write** the dimensions of both sides.\n- **Equate** the powers of M, L, T and solve.", false], [1, "tbl", "Mechanics at a glance", "[[\"Quantity\", \"Dimensions\", \"SI unit\"], [[\"Velocity\", \"[L T⁻¹]\", \"m/s\"], [\"Acceleration\", \"[L T⁻²]\", \"m/s²\"], [\"Force\", \"[M L T⁻²]\", \"N\"], [\"Work, energy\", \"[M L² T⁻²]\", \"J\"], [\"Power\", \"[M L² T⁻³]\", \"W\"], [\"Momentum\", \"[M L T⁻¹]\", \"kg m/s\"], [\"Pressure\", \"[M L⁻¹ T⁻²]\", \"Pa\"], [\"Density\", \"[M L⁻³]\", \"kg/m³\"], [\"Angular momentum, h\", \"[M L² T⁻¹]\", \"J s\"], [\"Surface tension\", \"[M T⁻²]\", \"N/m\"], [\"Viscosity η\", \"[M L⁻¹ T⁻¹]\", \"Pa s\"], [\"Gravitational constant G\", \"[M⁻¹ L³ T⁻²]\", \"N m²/kg²\"]]]", false], [1, "tbl", "Heat and electricity at a glance", "[[\"Quantity\", \"Dimensions\", \"SI unit\"], [[\"Specific heat\", \"[L² T⁻² K⁻¹]\", \"J/(kg K)\"], [\"Latent heat\", \"[L² T⁻²]\", \"J/kg\"], [\"Boltzmann constant k\", \"[M L² T⁻² K⁻¹]\", \"J/K\"], [\"Gas constant R\", \"[M L² T⁻² K⁻¹ mol⁻¹]\", \"J/(mol K)\"], [\"Charge\", \"[A T]\", \"C\"], [\"Electric field\", \"[M L T⁻³ A⁻¹]\", \"V/m\"], [\"Potential\", \"[M L² T⁻³ A⁻¹]\", \"V\"], [\"Resistance\", \"[M L² T⁻³ A⁻²]\", \"Ω\"], [\"Capacitance\", \"[M⁻¹ L⁻² T⁴ A²]\", \"F\"], [\"Inductance\", \"[M L² T⁻² A⁻²]\", \"H\"], [\"Magnetic field B\", \"[M T⁻² A⁻¹]\", \"T\"], [\"ε₀\", \"[M⁻¹ L⁻³ T⁴ A²]\", \"F/m\"], [\"μ₀\", \"[M L T⁻² A⁻²]\", \"H/m\"]]]", false], [1, "tbl", "Same-dimension families", "[[\"Dimensions\", \"Quantities\"], [[\"[M L² T⁻²]\", \"Work, energy, torque, heat\"], [\"[M L⁻¹ T⁻²]\", \"Pressure, stress, Young’s modulus, energy density\"], [\"[T⁻¹]\", \"Frequency, angular velocity, decay constant\"], [\"[M L T⁻¹]\", \"Momentum, impulse\"], [\"[M L² T⁻¹]\", \"Planck’s constant, angular momentum\"], [\"[M T⁻²]\", \"Surface tension, spring constant\"], [\"[L² T⁻²]\", \"Gravitational potential, latent heat\"], [\"[T]\", \"L/R, RC, √(LC)\"]]]", false], [1, "nt", "Dimensionless quantities", "- **With a unit:** angle (rad), solid angle (sr).\n- **No unit:** strain, refractive index, relative density, Poisson’s ratio, coefficient of friction.", false], [1, "t", "", "To get dimensions fast, use the defining formula and unit. Force = ma gives [M L T⁻²]; work = F·d gives [M L² T⁻²]; pressure = F/A gives [M L⁻¹ T⁻²]. Everything else follows by division or multiplication.", true], [1, "t", "", "To derive a relation, assume the quantity = k × (a)ᵖ(b)ᵠ(c)ʳ, write the dimensions of each, and equate the powers of M, L and T. You get three equations for three unknowns.", false], [1, "m", "", "An angle is dimensionless even though it is measured in radians. Do not give it dimensions.", false], [1, "m", "", "A dimensionally correct equation is not always physically correct. The check cannot see numerical factors such as ½ or a missing term of the same dimensions.", true], [1, "x", "Check whether v = u + at is dimensionally correct.", "[v] = [L T⁻¹], [u] = [L T⁻¹], [at] = [L T⁻²][T] = [L T⁻¹]. Every term has the same dimensions, so the equation is dimensionally correct.", true], [1, "x", "Derive the time period of a simple pendulum from its length l, mass m and g.", "Let T = k mᵃ lᵇ gᶜ. Dimensions: [T] = [M]ᵃ [L]ᵇ [L T⁻²]ᶜ. Compare powers. M: a = 0. T: −2c = 1 so c = −½. L: b + c = 0 so b = ½. Hence T = k √(l/g). The period does not depend on mass. Experiment gives k = 2π.", true], [1, "x", "The force on a body is F = a/t² + b t. Find the dimensions of a and b.", "Each term has the dimensions of force [M L T⁻²]. [a] = [F][T²] = [M L]. [b] = [F]/[T] = [M L T⁻³].", true], [2, "one", "", "Significant figures show **how precise** a reading is. **Add by decimal places. Multiply by significant figures.**", false], [2, "tbl", "Counting significant figures", "[[\"Rule\", \"Example\", \"Count\"], [[\"Non-zero digits count\", \"2345\", \"4\"], [\"Zeros between digits count\", \"2005\", \"4\"], [\"Leading zeros never count\", \"0.0045\", \"2\"], [\"Trailing zeros after a decimal count\", \"4.500\", \"4\"], [\"Trailing zeros in a whole number do not\", \"1500\", \"2\"], [\"Same number in scientific form\", \"1.500 × 10³\", \"4\"], [\"Exact numbers (12 students)\", \"—\", \"unlimited\"]]]", false], [2, "mn", "", "**Quick count:** write the number in scientific notation. Every digit of the mantissa counts. 0.003060 = 3.060 × 10⁻³ gives 4.", false], [2, "tbl", "Calculating with significant figures", "[[\"Operation\", \"Keep\", \"Example\"], [[\"Add, subtract\", \"fewest decimal places\", \"12.11 + 18.0 + 1.013 = 31.1\"], [\"Multiply, divide\", \"fewest significant figures\", \"4.234 × 1.005 = 4.255\"]]]", false], [2, "nt", "Rounding off", "- Dropped digit **below 5**: keep the digit.\n- Dropped digit **above 5**: round up.\n- Exactly **5**: make the previous digit **even** (2.45 → 2.4, 2.35 → 2.4).", false], [2, "nt", "Scientific notation and order of magnitude", "Write N = **a × 10ᵇ** with 1 ≤ a < 10. Changing units does not change significant figures: 2.700 m = 2.700 × 10³ mm.\n- **a ≤ 3.16**: order of magnitude is 10ᵇ.\n- **a > 3.16**: order of magnitude is 10ᵇ⁺¹, so 4 × 10⁵ gives 10⁶.", false], [2, "t", "", "To count significant figures quickly, convert to scientific notation. Every digit in the mantissa counts. 0.003060 becomes 3.060 × 10⁻³, which has 4.", true], [2, "m", "", "0.0045 has only 2 significant figures. Leading zeros never count.", false], [2, "m", "", "Using the decimal-place rule for multiplication, or the significant-figure rule for addition, is a very common error. Match the rule to the operation.", true], [2, "x", "Add 12.11 m, 18.0 m and 1.013 m with the correct significant figures.", "Sum = 31.123 m. The term 18.0 has the fewest decimal places (1), so the result is 31.1 m.", false], [2, "x", "A rectangle is 4.234 m by 1.005 m. Give its area.", "4.234 × 1.005 = 4.25517 m². Both factors have 4 significant figures, so the area is 4.255 m².", false], [3, "one", "", "Error = measured value − true value. **Absolute errors add** for sums, **relative errors add** for products, and **powers multiply** the relative error.", false], [3, "nt", "Accuracy vs precision", "**Accuracy** is closeness to the true value.\n**Precision** is closeness of readings to each other. It is set by the least count.", false], [3, "img", "Accuracy and precision", "<svg viewBox=\"0 0 360 115\" width=\"100%\" role=\"img\" aria-label=\"Accuracy and precision\"><g transform=\"translate(0,0)\"><circle cx=\"45\" cy=\"50\" r=\"40\" fill=\"#fff\" stroke=\"#262626\"/><circle cx=\"45\" cy=\"50\" r=\"25\" fill=\"#fff\" stroke=\"#262626\"/><circle cx=\"45\" cy=\"50\" r=\"8\" fill=\"#F4503A\"/><circle cx=\"42\" cy=\"48\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"48\" cy=\"52\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"45\" cy=\"46\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"50\" cy=\"50\" r=\"3\" fill=\"#1A7FE0\"/><text x=\"45\" y=\"106\" font-size=\"9\" text-anchor=\"middle\" fill=\"#262626\" font-weight=\"700\">Accurate and precise</text></g><g transform=\"translate(90,0)\"><circle cx=\"45\" cy=\"50\" r=\"40\" fill=\"#fff\" stroke=\"#262626\"/><circle cx=\"45\" cy=\"50\" r=\"25\" fill=\"#fff\" stroke=\"#262626\"/><circle cx=\"45\" cy=\"50\" r=\"8\" fill=\"#F4503A\"/><circle cx=\"70\" cy=\"28\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"74\" cy=\"32\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"72\" cy=\"36\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"68\" cy=\"34\" r=\"3\" fill=\"#1A7FE0\"/><text x=\"45\" y=\"106\" font-size=\"9\" text-anchor=\"middle\" fill=\"#262626\" font-weight=\"700\">Precise, not accurate</text></g><g transform=\"translate(180,0)\"><circle cx=\"45\" cy=\"50\" r=\"40\" fill=\"#fff\" stroke=\"#262626\"/><circle cx=\"45\" cy=\"50\" r=\"25\" fill=\"#fff\" stroke=\"#262626\"/><circle cx=\"45\" cy=\"50\" r=\"8\" fill=\"#F4503A\"/><circle cx=\"30\" cy=\"35\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"60\" cy=\"70\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"52\" cy=\"28\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"25\" cy=\"62\" r=\"3\" fill=\"#1A7FE0\"/><text x=\"45\" y=\"106\" font-size=\"9\" text-anchor=\"middle\" fill=\"#262626\" font-weight=\"700\">Accurate on average</text></g><g transform=\"translate(270,0)\"><circle cx=\"45\" cy=\"50\" r=\"40\" fill=\"#fff\" stroke=\"#262626\"/><circle cx=\"45\" cy=\"50\" r=\"25\" fill=\"#fff\" stroke=\"#262626\"/><circle cx=\"45\" cy=\"50\" r=\"8\" fill=\"#F4503A\"/><circle cx=\"20\" cy=\"30\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"72\" cy=\"22\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"70\" cy=\"76\" r=\"3\" fill=\"#1A7FE0\"/><circle cx=\"28\" cy=\"74\" r=\"3\" fill=\"#1A7FE0\"/><text x=\"45\" y=\"106\" font-size=\"9\" text-anchor=\"middle\" fill=\"#262626\" font-weight=\"700\">Neither</text></g></svg>", false], [3, "tbl", "Types of errors", "[[\"Type\", \"Cause\", \"Remedy\"], [[\"Systematic\", \"Zero error, faulty method, personal habit\", \"Calibrate and correct\"], [\"Random\", \"Unpredictable changes\", \"Average many readings\"], [\"Gross\", \"Carelessness\", \"Repeat the reading\"], [\"Least count\", \"Instrument resolution\", \"Use a finer instrument\"]]]", false], [3, "nt", "Mean and percentage error in 4 steps", "- **Mean:** a = (a₁ + … + aₙ)/n.\n- **Absolute error:** Δaᵢ = |a − aᵢ|.\n- **Mean absolute error:** the average of all Δaᵢ.\n- **Percentage error:** (Δa / a) × 100 %.", false], [3, "tbl", "Combining errors: cheat sheet", "[[\"Result\", \"Error\", \"Say it as\"], [[\"Z = A ± B\", \"ΔZ = ΔA + ΔB\", \"Absolute errors add\"], [\"Z = A·B or A/B\", \"ΔZ/Z = ΔA/A + ΔB/B\", \"Relative errors add\"], [\"Z = Aᵖ Bᵠ / Cʳ\", \"p·ΔA/A + q·ΔB/B + r·ΔC/C\", \"Powers multiply\"]]]", false], [3, "tbl", "Ready-made results", "[[\"Quantity\", \"Fractional error\"], [[\"Pendulum g = 4π²l/T²\", \"Δl/l + 2ΔT/T\"], [\"Sphere volume (4/3)πr³\", \"3Δr/r\"], [\"Rectangle area\", \"Δl/l + Δb/b\"]]]", false], [3, "t", "", "In any error question, first write the formula for the result, then take the powers as multipliers of the fractional errors. The numerical factors (4π², ½, 2) never contribute any error.", true], [3, "t", "", "To find which measurement most affects the result, look for the largest value of (power × fractional error).", false], [3, "m", "", "Never subtract errors, not even when the quantities are subtracted. For Z = A − B the error is ΔA + ΔB.", true], [3, "m", "", "Fractional error of a measured time period is based on the total time divided by the number of oscillations. Timing 20 oscillations reduces the error in T twenty times.", false], [3, "x", "The length and breadth of a plate are (10.0 ± 0.1) cm and (5.0 ± 0.1) cm. Find the percentage error in its area.", "ΔA/A = Δl/l + Δb/b = 0.1/10.0 + 0.1/5.0 = 0.01 + 0.02 = 0.03. Percentage error = 3 %.", true], [3, "x", "A sphere has radius 2.0 ± 0.1 cm. Find the percentage error in its volume.", "ΔV/V = 3 Δr/r = 3 × 0.1/2.0 = 0.15, so the error is 15 %.", true], [3, "x", "Five readings of a length are 2.63, 2.56, 2.42, 2.71 and 2.80 cm. Find the mean, the mean absolute error and the percentage error.", "Mean = 13.12/5 = 2.62 cm. Absolute errors: 0.01, 0.06, 0.20, 0.09, 0.18. Mean absolute error = 0.54/5 = 0.108, about 0.11 cm. Percentage error = 0.11/2.62 × 100 ≈ 4 %.", false], [4, "one", "", "Vernier and screw gauge both read **main scale + extra scale × least count**. Always check the **zero error** first.", false], [4, "img", "Vernier callipers: main scale and vernier scale", "<svg viewBox=\"0 0 340 130\" width=\"100%\" role=\"img\" aria-label=\"Vernier callipers scale\"><rect x=\"10\" y=\"20\" width=\"320\" height=\"34\" fill=\"#F3EEE7\" stroke=\"#262626\"/><g stroke=\"#262626\" stroke-width=\"1.2\"><line x1=\"20\" y1=\"20\" x2=\"20\" y2=\"44\"/><line x1=\"50\" y1=\"20\" x2=\"50\" y2=\"38\"/><line x1=\"80\" y1=\"20\" x2=\"80\" y2=\"38\"/><line x1=\"110\" y1=\"20\" x2=\"110\" y2=\"38\"/><line x1=\"140\" y1=\"20\" x2=\"140\" y2=\"38\"/><line x1=\"170\" y1=\"20\" x2=\"170\" y2=\"44\"/><line x1=\"200\" y1=\"20\" x2=\"200\" y2=\"38\"/><line x1=\"230\" y1=\"20\" x2=\"230\" y2=\"38\"/><line x1=\"260\" y1=\"20\" x2=\"260\" y2=\"38\"/><line x1=\"290\" y1=\"20\" x2=\"290\" y2=\"38\"/><line x1=\"320\" y1=\"20\" x2=\"320\" y2=\"44\"/></g><rect x=\"50\" y=\"54\" width=\"214\" height=\"34\" fill=\"#DCEBFA\" stroke=\"#1A7FE0\"/><g stroke=\"#1A7FE0\" stroke-width=\"1.2\"><line x1=\"50\" y1=\"54\" x2=\"50\" y2=\"74\"/><line x1=\"77\" y1=\"54\" x2=\"77\" y2=\"70\"/><line x1=\"104\" y1=\"54\" x2=\"104\" y2=\"70\"/><line x1=\"131\" y1=\"54\" x2=\"131\" y2=\"70\"/><line x1=\"158\" y1=\"54\" x2=\"158\" y2=\"70\"/><line x1=\"185\" y1=\"54\" x2=\"185\" y2=\"74\"/><line x1=\"212\" y1=\"54\" x2=\"212\" y2=\"70\"/><line x1=\"239\" y1=\"54\" x2=\"239\" y2=\"70\"/><line x1=\"266\" y1=\"54\" x2=\"266\" y2=\"70\"/></g><text x=\"20\" y=\"14\" font-size=\"9\" fill=\"#262626\">Main scale (1 MSD = 1 mm)</text><text x=\"50\" y=\"104\" font-size=\"9\" fill=\"#1A7FE0\">Vernier scale: 10 VSD = 9 MSD</text><text x=\"50\" y=\"118\" font-size=\"9\" fill=\"#C73A27\" font-weight=\"700\">LC = 1 MSD − 1 VSD = 0.1 mm</text></svg>", false], [4, "img",
